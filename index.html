<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكراس الاحصائي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #27ae60;
      --hover-color: #219150;
      --bg-color: #eef2f3;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(-45deg, #e0f7fa, #b2ebf2, #80deea, #4dd0e1, #26c6da); /* ألوان زرقاء/سماوية أكثر حيوية واحترافية */
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--primary-color);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(#2c3e50 0.5px, transparent 0.5px);
      background-size: 30px 30px;
      opacity: 0.05;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }    /* يبدأ من المنتصف الأيسر */
      25% { background-position: 50% 0%; }   /* يتحرك إلى المنتصف العلوي */
      50% { background-position: 100% 50%; }  /* يتحرك إلى المنتصف الأيمن */
      75% { background-position: 50% 100%; } /* يتحرك إلى المنتصف السفلي */
      100% { background-position: 0% 50%; }  /* يعود إلى المنتصف الأيسر */
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 25px 20px; /* تم دمج تعاريف الـ padding */
      border-radius: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 550px;
      width: 90%;
      text-align: center;
      margin: 10px auto;
    }

    .logo {
      width: 100%; /* اجعل العرض يتناسب مع الحاوية */
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    h2 {
      margin: 15px 0 5px 0;
      font-size: 1rem;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: -0.5px;
    }

    .sub-header {
      font-size: 0.95rem;
      color: #7f8c8d;
      margin-top: 10px;
      font-weight: 400;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .button {
      color: white;
      padding: 12px 10px;
      text-decoration: none;
      border-radius: 15px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .button::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 20%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(30deg);
      transition: none;
    }

    .button:hover::after {
      left: 120%;
      transition: all 0.7s ease-in-out;
    }

    .button:hover { 
      transform: translateY(-3px);
      filter: brightness(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .button i {
      transition: transform 0.3s ease;
    }

    .button:hover i {
      transform: scale(1.2) rotate(-10deg);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ألوان مخصصة لكل زر */
    .btn-kindergarten { background: linear-gradient(45deg, #e67e22, #f39c12); box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3); animation-delay: 0.2s; }
    .btn-kindergarten:hover { background: linear-gradient(45deg, #d35400, #e67e22); box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4); }

    .btn-primary { background: linear-gradient(45deg, #27ae60, #2ecc71); box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); animation-delay: 0.4s; }
    .btn-primary:hover { background: linear-gradient(45deg, #219150, #27ae60); box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4); }

    .btn-secondary { background: linear-gradient(45deg, #2980b9, #3498db); box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3); animation-delay: 0.6s; }
    .btn-secondary:hover { background: linear-gradient(45deg, #2471a3, #2980b9); box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4); }

    .btn-vocational { background: linear-gradient(45deg, #8e44ad, #9b59b6); box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); animation-delay: 0.8s; }
    .btn-vocational:hover { background: linear-gradient(45deg, #71338a, #8e44ad); box-shadow: 0 6px 20px rgba(142, 68, 173, 0.4); }

    .btn-institutes { background: linear-gradient(45deg, #c0392b, #e74c3c); box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3); animation-delay: 1.0s; grid-column: span 2; }
    .btn-institutes:hover { background: linear-gradient(45deg, #a93226, #c0392b); box-shadow: 0 6px 20px rgba(192, 57, 43, 0.4); }

    .button:active {
      transform: translateY(-1px);
    }

    .footer-text {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #b0bec5; /* لون باهت واحترافي */
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      padding-top: 15px;
      line-height: 1.8;
      position: relative;
    }
    .designer-name {
      color: #90a4ae; /* جعل اسم المصمم باهتًا ليتناسق مع الفوتر */
      font-weight: 700;
    }

    /* Loading Overlay Styles */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #e0f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(44, 62, 80, 0.1);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loader" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="container">
    <div class="header-box">
      <img src="https://github.com/user-attachments/assets/db260d0b-5d9d-4fcc-855e-3c4aaf92de71" alt="شعار المديرية" class="logo">
      <h2>قسم التخطيط التربوي / شعبة الاحصاء</h2>
    </div>

    <div class="button-group">
      <a class="button btn-kindergarten" href="https://ee.kobotoolbox.org/x/pSFzgn5D">
        <i class="fas fa-child"></i>
        رياض أطفال
      </a>
      <a class="button btn-primary" href="https://ee-eu.kobotoolbox.org/x/PRIMARY_FORM_URL">
        <i class="fas fa-book-open"></i>
        المدارس الابتدائية
      </a>
      <a class="button btn-secondary" href="https://ee-eu.kobotoolbox.org/x/SECONDARY_FORM_URL">
        <i class="fas fa-graduation-cap"></i>
        المدارس الثانوية
      </a>
      <a class="button btn-vocational" href="https://ee-eu.kobotoolbox.org/x/VOCATIONAL_FORM_URL">
        <i class="fas fa-tools"></i>
        المهني
      </a>
      <a class="button btn-institutes" href="https://ee-eu.kobotoolbox.org/x/INSTITUTES_FORM_URL">
        <i class="fas fa-university"></i>
        المعاهد
      </a>
    </div>

    <div class="footer-text">
      © جميع الحقوق محفوظة للمديرية العامة للتربية في محافظة النجف الاشرف
      <br>
      مصمم النظام: <span class="designer-name">م.م محمد مصطفى الامارة</span>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      const loader = document.getElementById('loader');
      loader.classList.add('hidden');
    });
  </script>
</body>
</html>
